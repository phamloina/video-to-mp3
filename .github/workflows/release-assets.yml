name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the assets
        required: true
        default: v0.2.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build portable package
        shell: pwsh
        run: ./scripts/package-portable-win-x64.ps1

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/packages -File |
            Where-Object { $_.Name -match '\.zip(?:\.sha256)?$' } |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected a ZIP and checksum, found $($assets.Count) assets."
          }
          gh release upload $env:RELEASE_TAG $assets --clobber
