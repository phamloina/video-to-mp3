name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore VideoToMp3.sln
      - name: Build
        run: dotnet build VideoToMp3.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VideoToMp3.sln --configuration Release --no-build --verbosity normal
      - name: Publish Windows x64
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/publish-win-x64.ps1
      - name: Verify publish layout
        shell: pwsh
        run: |
          $required = @(
            "artifacts/publish/win-x64/VideoToMp3.App.exe",
            "artifacts/publish/win-x64/tools/ffmpeg/README.txt",
            "artifacts/publish/win-x64/tools/yt-dlp/README.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing publish output: $path"
            }
          }
