name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore VideoToMp3.sln
      - name: Build
        run: dotnet build VideoToMp3.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VideoToMp3.sln --configuration Release --no-build --verbosity normal
