name: Bug report
description: Report a reproducible defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Video To MP3. Do not report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows version and relevant tool versions
    validations:
      required: true
